<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Стратегии ценообразования КлиматКомфорт39</title><desc id="desc">Сравнение эконом, профессиональной проектной и люкс-стратегий. Рекомендована средне-премиальная стратегия Проектный комфорт.</desc>
<defs><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#d89b55"/><stop offset="1" stop-color="#f0d4a9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14342e" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="620" rx="28" fill="#f7f3ec"/><text x="65" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#82908a" letter-spacing="3">ЦЕНОВОЕ ПОЗИЦИОНИРОВАНИЕ</text><text x="65" y="126" font-family="Georgia, serif" font-size="39" fill="#14342e">От «дёшево и быстро» к управляемому комфорту</text>
<g font-family="Arial, sans-serif" filter="url(#s)"><rect x="65" y="175" width="330" height="355" rx="20" fill="#fff"/><rect x="435" y="155" width="330" height="395" rx="20" fill="#183b34"/><rect x="805" y="175" width="330" height="355" rx="20" fill="#fff"/></g>
<g font-family="Arial, sans-serif"><text x="100" y="222" font-size="15" font-weight="700" fill="#81918a" letter-spacing="2">01 · ОБЪЁМ / СЕЗОН</text><text x="100" y="270" font-family="Georgia, serif" font-size="29" fill="#16352f">Конкурировать ценой</text><text x="100" y="310" font-size="17" fill="#556963">Быстрый монтаж, акции,</text><text x="100" y="338" font-size="17" fill="#556963">максимальная загрузка бригад.</text><path d="M100 385h250" stroke="#d9e0dc"/><text x="100" y="421" font-size="15" font-weight="700" fill="#81918a">РИСК</text><text x="100" y="452" font-size="16" fill="#556963">Маржинальность, сезонность,</text><text x="100" y="478" font-size="16" fill="#556963">не готовит вход в люкс.</text>
<text x="470" y="206" font-size="15" font-weight="700" fill="#d9c59e" letter-spacing="2">02 · РЕКОМЕНДУЕТСЯ</text><text x="470" y="254" font-family="Georgia, serif" font-size="29" fill="#fffaf2">Проектный комфорт</text><text x="470" y="294" font-size="17" fill="#dce9df">Инженерный бриф, дизайн-</text><text x="470" y="322" font-size="17" fill="#dce9df">координация, монтаж, сервис.</text><path d="M470 370h250" stroke="#65847b"/><text x="470" y="407" font-size="15" font-weight="700" fill="#f0d4a9">ЦЕННОСТЬ</text><text x="470" y="438" font-size="16" fill="#dce9df">Прозрачный объём работ,</text><text x="470" y="464" font-size="16" fill="#dce9df">снижение переделок, сопровождение.</text><rect x="470" y="490" width="196" height="30" rx="15" fill="url(#accent)"/><text x="568" y="511" text-anchor="middle" font-size="13" font-weight="700" fill="#3f2c18">ОСНОВА ДЛЯ РОСТА</text>
<text x="840" y="222" font-size="15" font-weight="700" fill="#81918a" letter-spacing="2">03 · ПРЕМИУМ / КУРАТОРСТВО</text><text x="840" y="270" font-family="Georgia, serif" font-size="29" fill="#16352f">Клубный сервис</text><text x="840" y="310" font-size="17" fill="#556963">Индивидуальный менеджер,</text><text x="840" y="338" font-size="17" fill="#556963">расширенный SLA, интеграция.</text><path d="M840 385h250" stroke="#d9e0dc"/><text x="840" y="421" font-size="15" font-weight="700" fill="#81918a">УСЛОВИЕ</text><text x="840" y="452" font-size="16" fill="#556963">Нужны портфолио, процессы</text><text x="840" y="478" font-size="16" fill="#556963">и подтверждённый сервис.</text></g>
</svg>